version: '3.9'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rental_portal
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: rental
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://rental:rental@db:5432/rental_portal
      JWT_SECRET_KEY: super-secret-change-me
    ports:
      - '5000:5000'
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - '4200:4200'
    depends_on:
      - backend

volumes:
  postgres_data:
